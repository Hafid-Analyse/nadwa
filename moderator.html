<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المنشّط</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1418">
<script>try{var t=new URLSearchParams(location.search).get('theme')||localStorage.getItem('nadwa_theme');if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="icon" type="image/svg+xml" href="assets/icon-moderator.svg">
<link rel="apple-touch-icon" href="assets/icon-moderator-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 18px 16px 40px; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem; margin-bottom: 1.1rem; }
  .head .logo { height: 40px; }
  .head h1 { font-size: 1.25rem; margin: 0; flex: 1; min-width: 200px; font-weight: 800; }
  .head h1 small { display: block; font-size: .8rem; color: var(--muted); font-weight: 400; }
  .switch { display: inline-flex; align-items: center; gap: .5em; font-size: .9rem; font-weight: 700; cursor: pointer; }
  .spotbar { background: var(--grad); color: var(--on-accent);
    border-radius: 20px; padding: .9rem 1.1rem; display: flex; gap: .8rem; align-items: center; margin-bottom: 1rem; box-shadow: 0 10px 28px var(--glow); }
  .spotbar .t { flex: 1; font-weight: 800; }
  .spotbar small { display: block; opacity: .75; font-weight: 700; font-size: .8rem; }
  .spotbar .btn.quiet { background: rgba(0,0,0,.15); color: var(--on-accent); border-color: rgba(0,0,0,.15); }
  .tabs { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; position: sticky; top: 0; padding: .6rem 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .tabs button { border: 1px solid var(--chip-line); background: var(--chip); border-radius: 99px; padding: .45em 1.05em; cursor: pointer; font-weight: 700; color: var(--chip-ink); transition: .15s; }
  .tabs button[aria-selected=true] { background: var(--grad); color: var(--on-accent); border-color: transparent; box-shadow: 0 4px 14px var(--glow); }
  .tabs .c { display: inline-block; min-width: 1.6em; padding: 0 .4em; border-radius: 99px; background: color-mix(in srgb, var(--ink) 12%, transparent); font-size: .8rem; margin-inline-start: .35em; text-align: center; }
  .tabs [data-tab=pending] .c.hot { background: var(--amber); color: #2A1C15; }
  #list { display: grid; gap: .7rem; }
  .q .actions { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .7rem; }
  .q .likes { flex: none; text-align: center; min-width: 58px; font-weight: 800; color: var(--accent); font-size: 1.3rem; }
  .q .likes small { display: block; font-size: .7rem; color: var(--muted); font-weight: 400; }
  .q.spotlit { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 6px 24px var(--glow); }
  .empty { text-align: center; color: var(--muted); padding: 3rem 0; }
  .links { display: flex; gap: .45rem; align-items: center; }
  .links .theme-btn { width: 36px; height: 36px; }
</style>
</head>
<body>
<div class="orbs"><span class="w o1"></span><span class="d o2"></span><span class="d o4"></span></div>
<div id="gate" hidden>
  <form class="card">
    <img class="logo" data-logo alt="">
    <h1>لوحة المنشّط</h1>
    <label class="field"><input type="password" placeholder="رمز المنشّط" autocomplete="current-password" required></label>
    <button class="btn" style="width:100%">دخول</button>
  </form>
</div>

<div class="wrap">
  <div class="head">
    <img class="logo" data-logo alt="" hidden>
    <h1 id="title">…<small></small></h1>
    <label class="switch"><input type="checkbox" id="openToggle"> باب الأسئلة مفتوح</label>
    <div class="links">
      <span id="themeSlot"></span>
      <a class="btn sm ghost" href="screen.html" target="_blank">شاشة العرض</a>
      <a class="btn sm ghost" href="settings.html">الإعدادات</a>
    </div>
  </div>

  <div class="spotbar" id="spotbar" hidden>
    <div class="t" id="spotText"></div>
    <button class="btn sm quiet" id="spotDone">تمت الإجابة</button>
    <button class="btn sm quiet" id="spotClear">إزالة من الشاشة</button>
  </div>

  <div class="tabs" role="tablist">
    <button data-tab="pending" aria-selected="true">بانتظار المراجعة<span class="c">0</span></button>
    <button data-tab="approved" aria-selected="false">المعروضة<span class="c">0</span></button>
    <button data-tab="answered" aria-selected="false">تمت الإجابة<span class="c">0</span></button>
    <button data-tab="hidden" aria-selected="false">المخفية<span class="c">0</span></button>
  </div>
  <div id="list"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const { rpc, esc, applyTheme, toast, flip, adminGate, C } = Nadwa;
  const $ = id => document.getElementById(id);
  let pin, ev, qs = [], tab = 'pending', timer, firstLoad = true, busy = false;
  const params = new URLSearchParams(location.search);

  const ACTIONS = {
    pending:  [['approved', 'قبول', ''], ['spot', 'قبول وعرض الآن', 'ghost'], ['hidden', 'إخفاء', 'quiet']],
    approved: [['spot', 'عرض على الشاشة', ''], ['answered', 'تمت الإجابة', 'ghost'], ['hidden', 'إخفاء', 'quiet']],
    answered: [['approved', 'إعادة للعرض', 'quiet']],
    hidden:   [['approved', 'استعادة ونشر', 'quiet'], ['pending', 'إرجاع للمراجعة', 'quiet']],
  };

  function fmtTime(t) { try { return new Date(t).toLocaleTimeString('ar-DZ-u-nu-latn', { hour: '2-digit', minute: '2-digit' }); } catch (_) { return ''; } }

  function render() {
    const counts = { pending: 0, approved: 0, answered: 0, hidden: 0 };
    qs.forEach(q => counts[q.status]++);
    document.querySelectorAll('[data-tab]').forEach(b => {
      const c = b.querySelector('.c'); c.textContent = counts[b.dataset.tab];
      if (b.dataset.tab === 'pending') c.classList.toggle('hot', counts.pending > 0);
    });
    document.title = (counts.pending ? `(${counts.pending}) ` : '') + 'لوحة المنشّط';

    const spot = qs.find(q => ev && q.id === ev.spotlight_id);
    $('spotbar').hidden = !spot;
    if (spot) $('spotText').innerHTML = esc(spot.body) + `<small>معروض الآن على الشاشة · ${spot.likes} إعجاب</small>`;

    let rows = qs.filter(q => q.status === tab);
    if (tab === 'approved') rows.sort((a, b) => b.likes - a.likes);
    else if (tab === 'answered') rows.sort((a, b) => (b.answered_at || '').localeCompare(a.answered_at || ''));
    else rows.sort((a, b) => a.created_at.localeCompare(b.created_at));

    flip($('list'), () => {
      $('list').innerHTML = rows.length ? rows.map(q => `
        <article class="q${ev && q.id === ev.spotlight_id ? ' spotlit' : ''}" data-id="${q.id}">
          <div class="body">${esc(q.body)}
            <div class="meta"><span>${q.author ? esc(q.author) : 'بدون اسم'}</span>${q.target ? `<span>إلى: ${esc(q.target)}</span>` : ''}<span>${fmtTime(q.created_at)}</span></div>
            <div class="actions">${ACTIONS[q.status].map(([a, label, cls]) =>
              `<button class="btn sm ${cls}" data-act="${a}" data-q="${q.id}">${label}</button>`).join('')}</div>
          </div>
          <div class="likes">${q.likes}<small>إعجاب</small></div>
        </article>`).join('') : '<p class="empty">لا توجد أسئلة هنا</p>';
    });
  }

  async function load() {
    clearTimeout(timer);
    try {
      if (!ev) {
        const evs = await rpc('admin_list_events', { p_pin: pin });
        const want = params.get('e');
        ev = evs.find(e => e.id === want) || evs.find(e => e.is_active) || evs[0];
        if (!ev) { $('title').firstChild.textContent = 'لا توجد ندوة — أنشئها من الإعدادات'; return; }
      }
      const d = await rpc('admin_list_questions', { p_pin: pin, p_event: ev.id });
      ev = d.event; qs = d.questions;
      $('title').firstChild.textContent = ev.title;
      $('title').querySelector('small').textContent = ev.moderation ? 'المراجعة مفعّلة: الأسئلة تنتظر قبولك' : 'المراجعة معطّلة: الأسئلة تُنشر مباشرة';
      $('openToggle').checked = ev.is_open;
      applyTheme(ev);
      if (firstLoad && !ev.moderation) { setTab('approved'); }
      firstLoad = false;
      if (!busy) render();
    } catch (e) {
      if (e.pin) { Nadwa.session.del('nadwa_pin'); location.reload(); return; }
      toast(e.message, 'err');
    } finally { timer = setTimeout(load, C.REFRESH_MODERATOR_SEC * 1000); }
  }

  function setTab(t) {
    tab = t;
    document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
    render();
  }
  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));

  async function act(a, id) {
    busy = true;
    try {
      if (a === 'spot') {
        await rpc('admin_spotlight', { p_pin: pin, p_event: ev.id, p_question: id });
        ev.spotlight_id = id;
        const q = qs.find(x => x.id === id); if (q && q.status === 'pending') q.status = 'approved';
        toast('معروض الآن على الشاشة', 'ok');
      } else {
        await rpc('admin_set_status', { p_pin: pin, p_question: id, p_status: a });
        const q = qs.find(x => x.id === id);
        if (q) { q.status = a; if (a === 'answered') q.answered_at = new Date().toISOString(); }
        if (['hidden', 'pending'].includes(a) && ev.spotlight_id === id) ev.spotlight_id = null;
      }
    } catch (e) { toast(e.message, 'err'); }
    finally { busy = false; render(); }
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (b) { b.disabled = true; act(b.dataset.act, b.dataset.q); }
  });

  $('spotClear').onclick = async () => {
    try { await rpc('admin_spotlight', { p_pin: pin, p_event: ev.id, p_question: null }); ev.spotlight_id = null; render(); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('spotDone').onclick = async () => {
    const id = ev.spotlight_id; if (!id) return;
    await act('answered', id);
    try { await rpc('admin_spotlight', { p_pin: pin, p_event: ev.id, p_question: null }); ev.spotlight_id = null; render(); } catch (_) {}
  };
  $('openToggle').onchange = async e => {
    try {
      ev = await rpc('admin_save_event', { p_pin: pin, p_event: ev.id, p_data: { is_open: e.target.checked } });
      toast(ev.is_open ? 'فُتح باب الأسئلة' : 'أُغلق باب الأسئلة', 'ok');
    } catch (err) { e.target.checked = !e.target.checked; toast(err.message, 'err'); }
  };

  $('themeSlot').appendChild(Nadwa.themeButton());
  adminGate(p => { pin = p; load(); });
})();
</script>
</body>
</html>
