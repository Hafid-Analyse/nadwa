<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة العرض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  html, body { height: 100%; }
  body { font-size: clamp(14px, 1.15vw, 26px); overflow: hidden; background: var(--bg); }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 1fr; padding: 2.2em 2.6em; gap: 1.6em; }
  header { display: flex; align-items: center; gap: 1.2em; }
  header img { height: 4.2em; }
  header h1 { margin: 0; font-size: 2.3em; line-height: 1.25; color: var(--accent); }
  header p { margin: .2em 0 0; color: var(--muted); font-size: 1.1em; }
  .grid { display: grid; grid-template-columns: 1fr 17em; gap: 2em; min-height: 0; }
  .main { display: flex; flex-direction: column; gap: 1em; min-height: 0; }
  .spot {
    background: var(--accent); color: #fff; border-radius: 1.1em; padding: 1.4em 1.8em;
    font-size: 1.9em; line-height: 1.45; font-weight: 600; position: relative;
  }
  .spot small { display: block; font-size: .5em; font-weight: 400; opacity: .85; margin-top: .6em; }
  .spot .tag { position: absolute; top: -.75em; inset-inline-start: 1.1em; background: #fff; color: var(--accent);
    font-size: .42em; padding: .25em .9em; border-radius: 99px; font-weight: 700; box-shadow: 0 2px 8px rgb(0 0 0 / .15); }
  #list { display: flex; flex-direction: column; gap: .7em; overflow: hidden; min-height: 0; flex: 1; }
  .row {
    display: flex; align-items: center; gap: 1em; background: var(--card); border: 1px solid var(--line);
    border-radius: .9em; padding: .8em 1.1em; font-size: 1.35em; line-height: 1.45; flex: none;
  }
  .row .rank { flex: none; width: 1.9em; height: 1.9em; border-radius: 50%; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: .85em; }
  .row .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .who { display: block; font-size: .68em; color: var(--muted); }
  .row .n { flex: none; display: flex; align-items: center; gap: .3em; font-weight: 700; color: var(--accent); font-size: 1.05em; }
  .row .n svg { width: 1em; height: 1em; }
  .row.is-spot { box-shadow: inset 0 0 0 2px var(--accent); }
  aside { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 1.1em; padding: 1.4em; gap: .8em; }
  #qr { background: #fff; padding: .7em; border-radius: .7em; }
  #qr img, #qr canvas { width: 13em !important; height: 13em !important; display: block; }
  aside strong { font-size: 1.4em; color: var(--accent); }
  aside .url { font-size: .8em; color: var(--muted); direction: ltr; overflow-wrap: anywhere; }
  aside .count { font-size: 1em; color: var(--muted); }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 1.6em; }
  .closed-flag { font-size: .9em; color: var(--warn); font-weight: 600; }
  .tools { position: fixed; bottom: .8em; inset-inline-start: .8em; display: flex; gap: .5em; opacity: 0; transition: .2s; }
  body:hover .tools { opacity: 1; }
  .noqr .grid { grid-template-columns: 1fr; }
  .noqr aside { display: none; }
</style>
</head>
<body>
<div class="stage">
  <header>
    <img data-logo alt="" hidden>
    <div><h1 id="title">…</h1><p id="sub"></p></div>
  </header>
  <div class="grid">
    <div class="main">
      <div class="spot" id="spot" hidden></div>
      <div id="list"></div>
    </div>
    <aside>
      <strong>اطرح سؤالك</strong>
      <div id="qr"></div>
      <div class="muted">امسح الرمز بهاتفك</div>
      <div class="url" id="url"></div>
      <div class="closed-flag" id="closed" hidden>باب الأسئلة مغلق</div>
      <div class="count" id="count"></div>
    </aside>
  </div>
</div>
<div class="tools">
  <button class="btn sm quiet" id="fs">ملء الشاشة</button>
  <button class="btn sm quiet" id="toggleQr">إظهار/إخفاء الرمز</button>
</div>

<script src="lib/qrcode.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const { rpc, esc, applyTheme, formatDate, flip, attendeeUrl, drawQr, C } = Nadwa;
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  let eventId = params.get('e') || null;
  const SHOW = +(params.get('n') || 7);   // عدد الأسئلة المعروضة
  let qrDone = false;
  const heart = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';
  if (params.get('qr') === '0') document.body.classList.add('noqr');

  function makeQr(ev) {
    if (qrDone) return;
    const url = attendeeUrl() + (params.get('e') ? '?e=' + ev.id : '');
    $('url').textContent = url.replace(/^https?:\/\//, '');
    drawQr($('qr'), url, 600);
    qrDone = true;
  }

  async function load() {
    try {
      const d = await rpc('get_board', { p_event: eventId, p_order: 'top', p_limit: SHOW + 1 });
      if (!d.event) { $('title').textContent = 'لا توجد ندوة نشطة'; return; }
      const ev = d.event;
      document.title = ev.title;
      $('title').textContent = ev.title;
      $('sub').textContent = [ev.subtitle, formatDate(ev.event_date)].filter(Boolean).join(' — ');
      applyTheme(ev); makeQr(ev);
      $('closed').hidden = ev.is_open;
      $('count').textContent = d.total ? `${d.total} سؤالًا` : '';

      const s = d.spotlight;
      $('spot').hidden = !s;
      if (s) $('spot').innerHTML = `<span class="tag">السؤال الآن</span>${esc(s.b)}
        <small>${[s.a, s.t ? 'إلى: ' + s.t : ''].filter(Boolean).map(esc).join(' · ')}</small>`;

      const rows = d.questions.filter(q => !s || q.id !== s.id).slice(0, s ? SHOW - 2 : SHOW);
      flip($('list'), () => {
        $('list').innerHTML = rows.length ? rows.map((q, i) => `
          <div class="row" data-id="${q.id}">
            <span class="rank">${i + 1}</span>
            <span class="txt">${esc(q.b)}${q.a || q.t ? `<span class="who">${[q.a, q.t ? 'إلى: ' + q.t : ''].filter(Boolean).map(esc).join(' · ')}</span>` : ''}</span>
            <span class="n">${heart}${q.l}</span>
          </div>`).join('') : (s ? '' : '<p class="empty">في انتظار أسئلتكم…</p>');
      });
      // إن لم تتسع الشاشة لكل الأسئلة، نخفي الزائد
      const list = $('list');
      [...list.children].forEach(el => (el.style.display = ''));
      while (list.scrollHeight > list.clientHeight + 2 && list.lastElementChild && list.children.length > 1) {
        const vis = [...list.children].filter(el => el.style.display !== 'none');
        if (vis.length <= 1) break;
        vis[vis.length - 1].style.display = 'none';
      }
    } catch (_) { /* نعيد المحاولة في الدورة القادمة */ }
    finally { setTimeout(load, C.REFRESH_SCREEN_SEC * 1000); }
  }

  $('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
  $('toggleQr').onclick = () => document.body.classList.toggle('noqr');
  load();
})();
</script>
</body>
</html>
