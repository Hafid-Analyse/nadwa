<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أسئلة الندوة</title>
<meta name="theme-color" content="#0f766e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 90px; }
  header.top {
    background: var(--accent); color: #fff; padding: 22px 16px 54px; text-align: center;
    border-radius: 0 0 26px 26px;
  }
  header.top img { height: 52px; margin-bottom: 8px; }
  header.top h1 { margin: 0; font-size: 1.35rem; line-height: 1.4; }
  header.top p { margin: .3rem 0 0; opacity: .88; font-size: .92rem; }
  .ask { margin-top: -36px; box-shadow: 0 8px 24px rgb(0 0 0 / .07); }
  .ask h2 { font-size: 1.05rem; margin: 0 0 .7rem; }
  .counter { font-size: .8rem; color: var(--muted); text-align: start; margin-top: -.6rem; margin-bottom: .8rem; }
  .counter.over { color: var(--danger); }
  .closed { text-align: center; padding: 1.4rem 1rem; }
  .sent { background: color-mix(in srgb, var(--ok) 10%, #fff); border-color: color-mix(in srgb, var(--ok) 35%, #fff); margin-top: .8rem; }
  .bar { display: flex; align-items: center; gap: .5rem; margin: 1.6rem 0 .8rem; }
  .tabs { display: flex; background: #ebe6db; border-radius: 10px; padding: 3px; flex: 1; }
  .tabs button { flex: 1; border: 0; background: none; padding: .5em; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected=true] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
  .refresh { width: 44px; height: 44px; border-radius: 10px; border: 0; background: #ebe6db; cursor: pointer; display: grid; place-items: center; }
  .refresh svg { width: 20px; height: 20px; }
  .refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  #list, #answered { display: grid; gap: .6rem; }
  .q.mine { border-color: color-mix(in srgb, var(--accent) 45%, #fff); }
  .empty { text-align: center; color: var(--muted); padding: 2rem 0; }
  h3.sec { font-size: .95rem; color: var(--muted); margin: 1.6rem 0 .6rem; }
  #answered .q { opacity: .72; }
  .idle { text-align: center; font-size: .85rem; color: var(--muted); margin-top: .8rem; }
  .idle button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
  .radio-row { display: flex; flex-wrap: wrap; gap: .4rem; }
  .radio-row label { border: 1.5px solid var(--line); border-radius: 99px; padding: .3em .9em; cursor: pointer; font-size: .9rem; background: #fff; }
  .radio-row input { display: none; }
  .radio-row input:checked + span { color: var(--accent); font-weight: 700; }
  .radio-row label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
</style>
</head>
<body>
<header class="top">
  <img data-logo alt="" hidden>
  <h1 id="title">…</h1>
  <p id="sub"></p>
</header>

<main class="wrap">
  <section class="card ask" id="askBox">
    <form id="askForm" hidden>
      <h2>اكتب سؤالك</h2>
      <label class="field" id="targetField" hidden>
        <span>موجّه إلى</span>
        <div class="radio-row" id="targets"></div>
      </label>
      <label class="field">
        <textarea id="body" maxlength="1000" placeholder="سؤالك هنا…" required></textarea>
      </label>
      <div class="counter" id="counter"></div>
      <label class="field" id="nameField">
        <span id="nameLabel">اسمك (اختياري)</span>
        <input type="text" id="name" maxlength="60" autocomplete="name">
      </label>
      <button class="btn" style="width:100%" id="sendBtn">إرسال السؤال</button>
    </form>
    <div class="closed" id="closedBox" hidden>
      <strong>باب الأسئلة مغلق حاليًا</strong>
      <p class="muted" style="margin:.3rem 0 0">يمكنك تصفّح الأسئلة والإعجاب بها</p>
    </div>
    <div class="card sent" id="sentBox" hidden></div>
  </section>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-order="top">الأكثر إعجابًا</button>
      <button role="tab" aria-selected="false" data-order="new">الأحدث</button>
    </div>
    <button class="refresh" id="refreshBtn" aria-label="تحديث">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
  <div id="list"></div>
  <div class="idle" id="idleBox" hidden>توقف التحديث التلقائي. <button id="resume">تحديث الآن</button></div>

  <h3 class="sec" id="answeredTitle" hidden>تمت الإجابة عليها</h3>
  <div id="answered"></div>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(() => {
  const { rpc, deviceId, store, esc, applyTheme, formatDate, toast, flip, C } = Nadwa;
  const $ = id => document.getElementById(id);
  const dev = deviceId();
  const params = new URLSearchParams(location.search);
  let eventId = params.get('e') || null;
  let ev = null, order = 'top', timer = null, lastTouch = Date.now(), loading = false;

  const likedKey = () => 'nadwa_liked_' + (ev ? ev.id : '');
  const mineKey = () => 'nadwa_mine_' + (ev ? ev.id : '');
  const getSet = k => new Set(JSON.parse(store.get(k) || '[]'));
  const saveSet = (k, s) => store.set(k, JSON.stringify([...s].slice(-500)));

  const heart = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4h2c.7-1.3 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg>';

  function card(q, liked, mine) {
    return `<article class="q${mine ? ' mine' : ''}" data-id="${q.id}">
      <div class="body">${esc(q.b)}
        <div class="meta">${q.a ? '<span>' + esc(q.a) + '</span>' : ''}${q.t ? '<span>إلى: ' + esc(q.t) + '</span>' : ''}${mine ? '<span class="badge">سؤالك</span>' : ''}</div>
      </div>
      <button class="like${liked ? ' on' : ''}" data-like="${q.id}" aria-pressed="${liked}" aria-label="إعجاب">
        ${heart}<span>${q.l}</span></button>
    </article>`;
  }

  function renderEvent() {
    document.title = ev.title;
    $('title').textContent = ev.title;
    $('sub').textContent = [ev.subtitle, formatDate(ev.event_date)].filter(Boolean).join(' — ');
    applyTheme(ev);
    $('askForm').hidden = !ev.is_open;
    $('closedBox').hidden = ev.is_open;
    $('nameField').hidden = ev.name_mode === 'anonymous';
    $('nameLabel').textContent = ev.name_mode === 'required' ? 'اسمك' : 'اسمك (اختياري)';
    $('name').required = ev.name_mode === 'required';
    if (!$('name').value) $('name').value = store.get('nadwa_name') || '';
    const sp = ev.speakers || [];
    $('targetField').hidden = sp.length === 0;
    const current = (document.querySelector('input[name=target]:checked') || {}).value || '';
    const want = ['', ...sp].join('|');
    if ($('targets').dataset.list !== want) {
      $('targets').dataset.list = want;
      $('targets').innerHTML = ['', ...sp].map(s =>
        `<label><input type="radio" name="target" value="${esc(s)}"${s === current ? ' checked' : ''}><span>${s ? esc(s) : 'الجميع'}</span></label>`).join('');
    }
    updateCounter();
  }

  function renderLists(data) {
    const liked = getSet(likedKey()), mine = getSet(mineKey());
    flip($('list'), () => {
      $('list').innerHTML = data.questions.length
        ? data.questions.map(q => card(q, liked.has(q.id), mine.has(q.id))).join('')
        : '<p class="empty">لا توجد أسئلة بعد، كن أول من يسأل</p>';
    });
    $('answeredTitle').hidden = data.answered.length === 0;
    $('answered').innerHTML = data.answered.map(q => card(q, liked.has(q.id), mine.has(q.id))).join('');
  }

  async function load(manual) {
    if (loading) return; loading = true;
    $('refreshBtn').classList.add('spin');
    try {
      const data = await rpc('get_board', { p_event: eventId, p_order: order, p_limit: 60 });
      if (!data.event) { $('title').textContent = 'لا توجد ندوة نشطة حاليًا'; return; }
      const evChanged = !ev || ev.id !== data.event.id;
      ev = data.event; eventId = ev.id;
      renderEvent();
      renderLists(data);
      if (manual && !evChanged) toast('تم التحديث');
    } catch (e) { if (manual) toast(e.message, 'err'); }
    finally { loading = false; $('refreshBtn').classList.remove('spin'); schedule(); }
  }

  // تحديث تلقائي فقط والصفحة ظاهرة، ويتوقف بعد فترة دون لمس
  function schedule() {
    clearTimeout(timer);
    if (document.hidden) return;
    if (Date.now() - lastTouch > C.ATTENDEE_IDLE_MIN * 60000) { $('idleBox').hidden = false; return; }
    $('idleBox').hidden = true;
    timer = setTimeout(() => load(false), C.REFRESH_ATTENDEE_SEC * 1000);
  }
  const touch = () => { const wasIdle = !$('idleBox').hidden; lastTouch = Date.now(); if (wasIdle) load(false); };
  ['pointerdown', 'keydown', 'scroll'].forEach(t => addEventListener(t, touch, { passive: true }));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastTouch = Date.now(); load(false); } else clearTimeout(timer); });

  // إعجاب
  async function onLike(btn) {
    const id = btn.dataset.like, liked = getSet(likedKey());
    const want = !liked.has(id);
    const num = btn.querySelector('span');
    const before = +num.textContent;
    want ? liked.add(id) : liked.delete(id); saveSet(likedKey(), liked);
    document.querySelectorAll(`[data-like="${id}"]`).forEach(b => {
      b.classList.toggle('on', want); b.setAttribute('aria-pressed', want);
      b.querySelector('span').textContent = Math.max(0, before + (want ? 1 : -1));
    });
    try {
      const r = await rpc('like_question', { p_question: id, p_device: dev, p_like: want });
      document.querySelectorAll(`[data-like="${id}"] span`).forEach(s => (s.textContent = r.likes));
    } catch (e) {
      want ? liked.delete(id) : liked.add(id); saveSet(likedKey(), liked);
      document.querySelectorAll(`[data-like="${id}"]`).forEach(b => {
        b.classList.toggle('on', !want); b.querySelector('span').textContent = before;
      });
      toast(e.message, 'err');
    }
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-like]'); if (b) onLike(b); });

  // عدّاد الحروف
  function updateCounter() {
    const max = ev ? ev.max_len : 300, n = $('body').value.trim().length;
    $('counter').textContent = `${n} / ${max}`;
    $('counter').classList.toggle('over', n > max);
  }
  $('body').addEventListener('input', updateCounter);

  // إرسال سؤال
  $('askForm').addEventListener('submit', async e => {
    e.preventDefault();
    const body = $('body').value.trim(), name = $('name').value.trim();
    if (body.length > ev.max_len) return toast(`السؤال أطول من ${ev.max_len} حرفًا`, 'err');
    const target = (document.querySelector('input[name=target]:checked') || {}).value || '';
    $('sendBtn').disabled = true;
    try {
      const r = await rpc('submit_question', { p_event: ev.id, p_body: body, p_name: name, p_target: target, p_device: dev });
      if (name) store.set('nadwa_name', name);
      $('body').value = ''; updateCounter();
      const all = document.querySelector('input[name=target][value=""]'); if (all) all.checked = true;
      $('sentBox').hidden = false;
      $('sentBox').textContent = r.status === 'pending'
        ? '✓ وصل سؤالك، وسيظهر بعد مراجعة المنشّط. يمكنك الآن الإعجاب بأسئلة الآخرين.'
        : '✓ نُشر سؤالك. يمكنك الآن الإعجاب بأسئلة الآخرين.';
      setTimeout(() => ($('sentBox').hidden = true), 9000);
      if (r.id) { const s = getSet(mineKey()); s.add(r.id); saveSet(mineKey(), s); }
      load(false);
    } catch (err) { toast(err.message, 'err'); }
    finally { $('sendBtn').disabled = false; }
  });

  // التبويبات
  document.querySelectorAll('[data-order]').forEach(b => b.addEventListener('click', () => {
    order = b.dataset.order;
    document.querySelectorAll('[data-order]').forEach(x => x.setAttribute('aria-selected', x === b));
    load(false);
  }));
  $('refreshBtn').addEventListener('click', () => load(true));
  $('resume').addEventListener('click', () => { lastTouch = Date.now(); load(true); });

  load(false);
})();
</script>
</body>
</html>
